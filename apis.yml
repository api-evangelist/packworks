name: Packworks
description: Packworks is a Philippine business-to-business technology company empowering
  micro-entrepreneurs through connected commerce. Its Sari IQ platform gives sari-sari
  store owners and other micro-retailers an integrated mobile, web, and chat-based
  toolkit for inventory management, bookkeeping, sales analytics, credit (utang) tracking,
  deliveries and collections, loyalty programs, and financial literacy. Backed by
  Techstars, Packworks operates as an end-user SaaS platform for neighborhood retail
  and does not currently publish a public developer API, SDK, well-known discovery
  surface, or integration program.
